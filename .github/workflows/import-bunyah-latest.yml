name: Import latest Bunyah source

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-bunyah-latest.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest Bunyah package
        run: |
          curl --fail --location --retry 3             "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/fefcd47c-7683-43eb-b9e6-02e6e9b2bd32.zip"             --output /tmp/bunyah.zip

      - name: Import self-contained site
        run: |
          unzip -p /tmp/bunyah.zip "bunyah-source-complete/index.html" > index.html
          echo "c7eed54ba5644b10612ab8934a2d80532cae79670b3e961897d2539e9fc8dfc3  index.html" | sha256sum --check
          test -s index.html

      - name: Remove one-time importer
        run: rm -f .github/workflows/import-bunyah-latest.yml

      - name: Save imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/import-bunyah-latest.yml
          git commit -m "Import latest Bunyah source"
          git push
