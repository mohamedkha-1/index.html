name: Update FIELD NOTE 03 image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="FIELD NOTE 03"
          i=s.find(marker)
          if i<0:
              raise SystemExit("FIELD NOTE 03 not found")
          a=s.rfind('<article',0,i)
          b=s.find('</article>',i)
          block=s[a:b+10]
          block2=re.sub(r'(<div class="article-img)([^"]*)(">\s*<img[^>]*src=")[^"]+(")',
                        r'\1 pricing-files-image\2\3https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/d20b1267-ae97-4ad2-85df-faa52e57383a.png\4',
                        block,count=1,flags=re.S)
          if block2==block:
              raise SystemExit("Target image not replaced")
          s=s[:a]+block2+s[b+10:]
          css="""
<style id="pricing-files-image-fix">
.pricing-files-image{height:auto!important;min-height:0!important;aspect-ratio:770/774!important;overflow:hidden!important;background:#f3eee8!important}
.pricing-files-image img{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;max-height:none!important}
</style>
"""
          if 'id="pricing-files-image-fix"' not in s:
              s=s.replace("</head>",css+"</head>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update FIELD NOTE 03 image ratio"
          git push
