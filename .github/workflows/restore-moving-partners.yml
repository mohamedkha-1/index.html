name: Restore moving partner marquee
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/restore-moving-partners.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore two-row moving partner marquee
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          partners1 = [
          ('elixir-bun','logo-light logo-elixir','Elixir Bun Coffee Roasters'),
          ('princess-nourah-university','logo-light logo-nouf','Princess Nourah University'),
          ('qomra','logo-light logo-qomra','Qomra'),
          ('fahras','logo-light logo-fahras','Fahras by Mid-Sajj'),
          ('markab','logo-light logo-wordmark','MARKAB'),
          ('sica','logo-light logo-wordmark','SICA'),
          ('steam','logo-light logo-wordmark','STEAM'),
          ('dhafa','logo-light logo-wordmark ar','ضفة'),
          ('al-aziziyah','logo-light logo-wordmark ar','العزيزية'),
          ('listen-valley','logo-light logo-wordmark','LISTEN VALLEY'),
          ('sophia','logo-light logo-wordmark','SOPHIA'),
          ]
          partners2 = [
          ('mid-sajj','logo-light logo-midsajj','Mid-Sajj'),
          ('roshn','logo-light logo-roshn','ROSHN'),
          ('thaniah','logo-light logo-thania','ثمانية'),
          ('kalamashii','logo-light logo-kalamashii','Kalamashii'),
          ('mid','logo-light logo-mid','MID'),
          ('san-marzano','logo-light logo-sanmarzano','San Marzano Ristorante'),
          ('saon','logo-light logo-saon','SAON logistical services'),
          ('tend','logo-light logo-wordmark','TEND'),
          ('willow','logo-light logo-wordmark','WILLOW'),
          ('dermacare','logo-light logo-wordmark','DERMACARE'),
          ]
          
          def card(key, classes, label, clone=False):
              wm=' class="wm"' if 'logo-wordmark' in classes else ''
              attrs = f' class="logo-box {classes}"'
              if not clone:
                  attrs += f' data-partner="{key}"'
              else:
                  attrs += ' aria-hidden="true" data-clone="true"'
              return f'<div{attrs}><span{wm}>{label}</span></div>'
          
          def row(items, rev=False):
              original=''.join(card(*x, clone=False) for x in items)
              clone=''.join(card(*x, clone=True) for x in items)
              klass='partner-marquee reverse' if rev else 'partner-marquee'
              return f'<div class="{klass}"><div class="partner-track"><div class="partner-set">{original}</div><div class="partner-set" aria-hidden="true">{clone}</div></div></div>'
          
          new_section = (
          '<section class="section clients">'
          '<div class="wrap clients-head reveal">'
          '<span class="ey light">03 — TRUSTED BY</span>'
          '<h3>شركاء نفخر بالعمل معهم.</h3>'
          '<p class="clients-copy" style="max-width:760px;margin:12px auto 0;color:#CBBCC1;line-height:1.9;font-size:13px">'
          'خبرة بُنية تمتد عبر مشاريع تجارية وضيافة ومشاريع مؤسسية وخاصة، بمتطلبات تنفيذ مختلفة.'
          '</p></div>'
          + row(partners1, False)
          + row(partners2, True)
          + '</section>'
          )
          
          m=re.search(r'<section class="section clients">.*?</section>',s,flags=re.S)
          if not m:
              raise SystemExit("clients section not found")
          s=s[:m.start()]+new_section+s[m.end():]
          
          css = """
          <style id="partners-motion-live-v3">
          .clients{background:#1A1517;overflow:hidden}
          .clients .clients-head{text-align:center;margin-bottom:26px}
          .clients .partner-grid{display:none!important}
          .clients .partner-marquee{width:100%;overflow:hidden;padding:7px 0}
          .clients .partner-track{
            display:flex;
            width:max-content;
            will-change:transform;
            animation:partnersMove 38s linear infinite;
          }
          .clients .partner-marquee.reverse .partner-track{
            animation-direction:reverse;
            animation-duration:44s;
          }
          .clients .partner-marquee:hover .partner-track{animation-play-state:paused}
          .clients .partner-set{
            display:flex;
            gap:16px;
            padding-inline-end:16px;
            flex:none;
          }
          .clients .logo-box{
            min-width:260px!important;
            width:260px!important;
            height:132px!important;
            border:1px solid rgba(255,255,255,.08)!important;
            border-radius:28px!important;
            display:grid!important;
            place-items:center!important;
            position:relative!important;
            transition:.25s!important;
            overflow:hidden!important;
            padding:24px 30px!important;
            background-color:#F3EFED!important;
            background-position:center!important;
            background-repeat:no-repeat!important;
            background-origin:content-box!important;
            box-shadow:inset 0 0 0 1px rgba(20,15,17,.04)!important;
          }
          .clients .logo-box:hover{transform:translateY(-3px);border-color:rgba(193,184,173,.38)!important}
          .clients .logo-box>span:not(.wm){
            position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important
          }
          .clients .logo-wordmark{background-image:none!important}
          .clients .logo-wordmark .wm{
            position:static!important;width:auto!important;height:auto!important;overflow:visible!important;clip:auto!important;
            display:block!important;color:#171314!important;font-family:Poppins,Cairo,Arial,sans-serif!important;
            font-size:27px!important;font-weight:600!important;letter-spacing:.08em!important;line-height:1.1!important;white-space:nowrap!important
          }
          .clients .logo-wordmark.ar .wm{font-family:Cairo,Arial,sans-serif!important;letter-spacing:0!important;font-size:33px!important;font-weight:700!important}
          .clients .logo-qomra{background-size:58% auto!important}
          .clients .logo-nouf{background-size:70% auto!important}
          .clients .logo-elixir{background-size:50% auto!important}
          .clients .logo-kalamashii{background-size:70% auto!important}
          .clients .logo-thania{background-size:38% auto!important}
          .clients .logo-roshn{background-size:60% auto!important}
          .clients .logo-midsajj{background-size:34% auto!important}
          .clients .logo-fahras{background-size:50% auto!important}
          .clients .logo-mid{background-image:url("assets/logos/partners/mid.png")!important;background-size:44% auto!important}
          .clients .logo-sanmarzano{background-image:url("assets/logos/partners/sanmarzano.png")!important;background-size:46% auto!important}
          .clients .logo-saon{background-image:url("assets/logos/partners/saon.png")!important;background-size:60% auto!important}
          @keyframes partnersMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
          @media(max-width:900px){
            .clients .logo-box{min-width:220px!important;width:220px!important;height:116px!important;border-radius:24px!important;padding:20px 24px!important}
            .clients .logo-wordmark .wm{font-size:21px!important}
            .clients .logo-wordmark.ar .wm{font-size:27px!important}
            .clients .partner-track{animation-duration:31s}
            .clients .partner-marquee.reverse .partner-track{animation-duration:36s}
          }
          @media(prefers-reduced-motion:reduce){
            .clients .partner-track{animation:none!important}
          }
          </style>
          """
          
          if 'id="partners-motion-live-v3"' in s:
              s=re.sub(r'<style id="partners-motion-live-v3">.*?</style>',css.strip(),s,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)
          
          # Verify source roster = exactly 21 originals, no duplicate original IDs.
          section=re.search(r'<section class="section clients">.*?</section>',s,re.S).group(0)
          keys=re.findall(r'data-partner="([^"]+)"',section)
          if len(keys)!=21 or len(set(keys))!=21:
              raise SystemExit(f"partner roster invalid: total={len(keys)} unique={len(set(keys))}")
          
          for asset in ['assets/logos/partners/saon.png','assets/logos/partners/sanmarzano.png','assets/logos/partners/mid.png']:
              if not Path(asset).exists():
                  raise SystemExit(f"missing asset: {asset}")
          
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/restore-moving-partners.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-moving-partners.yml
          git commit -m "Restore moving partner marquee with 21 unique partners"
          git push
