name: Force latest partners live
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/force-latest-partners.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add cache bust and runtime guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          stamp='<!-- partners-live-cache-v48 -->'
          if stamp not in s:
              s=s.replace('<head>', '<head>'+stamp+'<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">',1)
          # runtime guard: if any legacy partner-grid somehow survives, hide it when moving marquees exist
          guard='''<script id="partners-live-guard-v48">
          document.addEventListener("DOMContentLoaded",function(){
            const clients=document.querySelector(".clients");
            if(!clients) return;
            if(clients.querySelector(".partner-marquee")){
              clients.querySelectorAll(".partner-grid").forEach(el=>el.remove());
            }
          });
          </script>'''
          if 'id="partners-live-guard-v48"' not in s:
              s=s.replace('</body>',guard+'</body>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/force-latest-partners.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/force-latest-partners.yml
          git commit -m "Force latest moving partners section live"
          git push
