name: Replace duration article image
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/replace-duration-image.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add replacement image
        run: |
          mkdir -p assets/knowledge
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/ad1dd238-2b5e-4493-83f6-255332c65933.png" -o assets/knowledge/project-duration-stages.png
          test -s assets/knowledge/project-duration-stages.png
      - name: Replace FIELD NOTE 02 image and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          pattern=re.compile(r'<article class="article reveal"><div class="article-img"><img([^>]*?)src="[^"]+"([^>]*)></div><div class="article-body"><span>FIELD NOTE 02 · إدارة مشروع</span>')
          replacement=r'<article class="article reveal duration-feature"><div class="article-img duration-full-image"><img\1src="assets/knowledge/project-duration-stages.png"\2></div><div class="article-body"><span>FIELD NOTE 02 · إدارة مشروع</span>'
          s,n=pattern.subn(replacement,s,count=1)
          if n!=1:
              raise SystemExit(f"Expected one FIELD NOTE 02 image replacement, got {n}")

          css=r'''
          <style id="duration-full-image-fix">
          .duration-feature .article-img.duration-full-image{
            width:100%!important;
            height:auto!important;
            min-height:0!important;
            aspect-ratio:948 / 520!important;
            overflow:hidden!important;
            background:#f2ede7!important;
          }
          .duration-feature .article-img.duration-full-image img{
            display:block!important;
            width:100%!important;
            height:100%!important;
            max-height:none!important;
            object-fit:contain!important;
            object-position:center center!important;
          }
          @media(max-width:700px){
            .duration-feature .article-img.duration-full-image{
              aspect-ratio:948 / 520!important;
              height:auto!important;
              min-height:0!important;
            }
            .duration-feature .article-img.duration-full-image img{
              width:100%!important;
              height:100%!important;
              object-fit:contain!important;
            }
          }
          </style>
          '''
          if 'id="duration-full-image-fix"' in s:
              s=re.sub(r'<style id="duration-full-image-fix">.*?</style>',css.strip(),s,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/replace-duration-image.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/knowledge/project-duration-stages.png .github/workflows/replace-duration-image.yml
          git commit -m "Replace duration article image with correct ratio"
          git push
