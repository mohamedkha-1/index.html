name: Center Dhafa visual journey content
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/center-dhafa-content.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Center visual journey heading content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css = """
          <style id="visual-journey-center-fix">
          .visual-journey .section-title{
            display:flex!important;
            flex-direction:column!important;
            align-items:center!important;
            justify-content:center!important;
            text-align:center!important;
            gap:14px!important;
          }
          .visual-journey .section-title>div{
            width:100%!important;
            display:flex!important;
            flex-direction:column!important;
            align-items:center!important;
            text-align:center!important;
          }
          .visual-journey .section-title .ey,
          .visual-journey .section-title h2,
          .visual-journey .section-title p{
            text-align:center!important;
            margin-left:auto!important;
            margin-right:auto!important;
          }
          .visual-journey .section-title h2{
            max-width:920px!important;
          }
          .visual-journey .section-title p{
            max-width:760px!important;
            margin-top:0!important;
          }
          @media (max-width:700px){
            .visual-journey .section-title{gap:10px!important}
            .visual-journey .section-title h2{max-width:100%!important}
            .visual-journey .section-title p{max-width:92%!important}
          }
          </style>
          """
          if 'id="visual-journey-center-fix"' not in s:
              if "</head>" not in s:
                  raise SystemExit("head end not found")
              s=s.replace("</head>", css+"</head>", 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/center-dhafa-content.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/center-dhafa-content.yml
          git commit -m "Center Dhafa visual journey content"
          git push
