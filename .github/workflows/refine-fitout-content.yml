name: Refine Fit-Out article content
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refine-fitout-content.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine first article content layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Give the target article its own class.
          s,n=re.subn(
            r'<article class="article big reveal"><div class="article-img fitout-full-image">',
            '<article class="article big reveal fitout-feature"><div class="article-img fitout-full-image">',
            s,count=1
          )
          if n==0 and 'fitout-feature' not in s:
              raise SystemExit("Fit-Out feature article not found")

          css=r'''
          <style id="fitout-content-layout-v1">
          .fitout-feature{
            height:auto!important;
            min-height:0!important;
            align-self:start!important;
          }
          .fitout-feature .article-body{
            display:block!important;
            position:relative!important;
            height:auto!important;
            min-height:0!important;
            margin:0!important;
            padding:34px 42px 32px!important;
            text-align:right!important;
            direction:rtl!important;
          }
          .fitout-feature .article-body>span:first-child{
            display:block!important;
            position:static!important;
            margin:0 0 12px!important;
            padding:0!important;
            color:var(--wine2)!important;
            font-size:11px!important;
            line-height:1.5!important;
            letter-spacing:.04em!important;
          }
          .fitout-feature .article-body h3{
            position:static!important;
            width:min(100%,880px)!important;
            max-width:880px!important;
            margin:0 0 14px auto!important;
            padding:0!important;
            font-size:clamp(30px,3.1vw,46px)!important;
            line-height:1.25!important;
            letter-spacing:-.025em!important;
          }
          .fitout-feature .article-body p{
            position:static!important;
            width:min(100%,900px)!important;
            max-width:900px!important;
            margin:0 0 0 auto!important;
            padding:0!important;
            color:#776C6F!important;
            font-size:clamp(14px,1.25vw,18px)!important;
            line-height:1.9!important;
          }
          .fitout-feature .article-body .read{
            display:block!important;
            position:static!important;
            width:100%!important;
            margin:24px 0 0!important;
            padding:0!important;
            text-align:left!important;
            white-space:nowrap!important;
            line-height:1.4!important;
          }
          @media(max-width:768px){
            .fitout-feature .article-body{
              padding:24px 22px 24px!important;
            }
            .fitout-feature .article-body>span:first-child{
              margin-bottom:9px!important;
              font-size:10px!important;
            }
            .fitout-feature .article-body h3{
              font-size:clamp(25px,7vw,34px)!important;
              line-height:1.3!important;
              margin-bottom:11px!important;
            }
            .fitout-feature .article-body p{
              font-size:13px!important;
              line-height:1.8!important;
            }
            .fitout-feature .article-body .read{
              margin-top:18px!important;
            }
          }
          </style>
          '''
          if 'id="fitout-content-layout-v1"' in s:
              s=re.sub(r'<style id="fitout-content-layout-v1">.*?</style>',css.strip(),s,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/refine-fitout-content.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-fitout-content.yml
          git commit -m "Refine Fit-Out article content layout"
          git push
