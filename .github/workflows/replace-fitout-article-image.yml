name: Replace Fit-Out article image
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/replace-fitout-article-image.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add replacement image
        run: |
          mkdir -p assets/knowledge
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/1a9f7d18-0823-4a32-887b-02efa2f23659.png" -o assets/knowledge/fitout-stages.png
          test -s assets/knowledge/fitout-stages.png
      - name: Replace first article image only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pattern=r'(<article class="article big reveal"><div class="article-img"><img alt="تنفيذ Fit-Out" src=")[^"]+(")'
          s2,n=re.subn(pattern,r'\1assets/knowledge/fitout-stages.png\2',s,count=1)
          if n != 1:
              raise SystemExit(f"Expected one replacement, got {n}")
          p.write_text(s2,encoding="utf-8")
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/replace-fitout-article-image.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/knowledge/fitout-stages.png .github/workflows/replace-fitout-article-image.yml
          git commit -m "Replace Fit-Out article image"
          git push
