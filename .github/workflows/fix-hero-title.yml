name: Fix hero title scale
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-hero-title.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix hero title only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css="""
<style id="hero-title-fix-v1">
.hero-copy h1{
  font-family:Cairo,Arial,sans-serif!important;
  font-size:clamp(46px,5.2vw,84px)!important;
  line-height:1.08!important;
  letter-spacing:-.035em!important;
  max-width:760px!important;
  margin:18px 0 24px!important;
  font-weight:800!important;
}
.hero-copy h1 span{
  display:block!important;
  margin-top:.08em!important;
  font-weight:500!important;
  line-height:1.12!important;
  color:var(--sand)!important;
}
@media(max-width:1100px){
  .hero-copy h1{
    font-size:clamp(44px,6vw,70px)!important;
    max-width:680px!important;
  }
}
@media(max-width:700px){
  .hero-copy h1{
    font-size:clamp(38px,10vw,54px)!important;
    line-height:1.14!important;
    letter-spacing:-.025em!important;
    max-width:100%!important;
    margin:14px 0 20px!important;
  }
  .hero-copy h1 span{
    margin-top:.12em!important;
    line-height:1.18!important;
  }
}
</style>
"""
          marker='id="hero-title-fix-v1"'
          if marker not in s:
              s=s.replace("</head>",css+"</head>",1)
          else:
              import re
              s=re.sub(r'<style id="hero-title-fix-v1">.*?</style>',css.strip(),s,flags=re.S)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-hero-title.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-hero-title.yml
          git commit -m "Fix hero title sizing and spacing"
          git push
