name: Fix hero title scale
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-hero-title.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix hero title only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css="<style id=\"hero-title-fix-v1\">\n.hero-copy h1{\n  font-family:Cairo,Arial,sans-serif!important;\n  font-size:clamp(46px,5.2vw,84px)!important;\n  line-height:1.08!important;\n  letter-spacing:-.035em!important;\n  max-width:760px!important;\n  margin:18px 0 24px!important;\n  font-weight:800!important;\n}\n.hero-copy h1 span{\n  display:block!important;\n  margin-top:.08em!important;\n  font-weight:500!important;\n  line-height:1.12!important;\n  color:var(--sand)!important;\n}\n@media(max-width:1100px){\n  .hero-copy h1{\n    font-size:clamp(44px,6vw,70px)!important;\n    max-width:680px!important;\n  }\n}\n@media(max-width:700px){\n  .hero-copy h1{\n    font-size:clamp(38px,10vw,54px)!important;\n    line-height:1.14!important;\n    letter-spacing:-.025em!important;\n    max-width:100%!important;\n    margin:14px 0 20px!important;\n  }\n  .hero-copy h1 span{\n    margin-top:.12em!important;\n    line-height:1.18!important;\n  }\n}\n</style>"
          if 'id="hero-title-fix-v1"' not in s:
              s=s.replace("</head>",css+"</head>",1)
          else:
              s=re.sub(r'<style id="hero-title-fix-v1">.*?</style>',css,s,flags=re.S)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-hero-title.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-hero-title.yml
          git commit -m "Fix hero title sizing and spacing"
          git push
