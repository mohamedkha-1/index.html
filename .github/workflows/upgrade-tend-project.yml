name: Upgrade Tend project card
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-tend-project.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Tend project images
        run: |
          mkdir -p assets/projects/tend
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/94dc7e1e-b03e-44e9-9e92-254cf48d52d1.jpg" -o assets/projects/tend/01-shell.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/e5b6bce9-1181-4ffb-82d9-4387245c23a9.jpg" -o assets/projects/tend/02-finishing.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/d2461dae-4900-4f96-85da-4aeee17e360d.jpg" -o assets/projects/tend/03-finishing.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/7c91eb2d-9d70-4a61-afa1-f2aee5055b3c.jpg" -o assets/projects/tend/04-detail.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/3a7c4d3e-9630-4345-858c-198a97ca6ea4.jpg" -o assets/projects/tend/05-delivered.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/d95391a5-5345-4282-88e5-9e141d34b82a.jpg" -o assets/projects/tend/06-delivered.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/6742f435-ddf8-463b-b589-1cc7c383680c.jpg" -o assets/projects/tend/07-delivered.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/e8906928-52e7-42db-a638-9edccf8491bd.jpg" -o assets/projects/tend/08-delivered.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/8946728f-49cd-4925-a6ea-85d3d8106104.jpg" -o assets/projects/tend/09-delivered.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/945de80a-a24c-4718-bce2-fb116706be8c.jpg" -o assets/projects/tend/10-delivered.jpg
          for f in assets/projects/tend/*; do test -s "$f"; done
      - name: Upgrade Tend card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          css_anchor=".markab-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          css_add=css_anchor+".tend-gallery{position:relative}.tend-gallery .tend-slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1.015);transition:opacity .75s ease,transform 1.2s var(--ease);object-fit:cover}.tend-gallery .tend-slide.active{opacity:1;transform:scale(1);z-index:1}.project-card:hover .tend-gallery .tend-slide.active{transform:scale(1.035)}.tend-gallery .project-badge{z-index:5}.tend-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          if ".tend-gallery{" not in s:
              if css_anchor not in s:
                  raise SystemExit("Gallery CSS anchor not found")
              s=s.replace(css_anchor,css_add,1)
          
          articles=list(re.finditer(r'<article class="project-card reveal">.*?</article>',s,flags=re.S))
          target=next((m for m in articles if 'Tend Salon — العزيزية' in m.group(0)),None)
          if not target:
              raise SystemExit("Tend card not found")
          
          gallery="""<div class="project-image tend-gallery" data-tend-gallery>
          <img class="tend-slide active" alt="Tend Salon في مرحلة العظم والتأسيس" src="assets/projects/tend/01-shell.jpg" loading="lazy"/>
          <img class="tend-slide" alt="Tend Salon أثناء أعمال التشطيبات" src="assets/projects/tend/02-finishing.jpg" loading="lazy"/>
          <img class="tend-slide" alt="Tend Salon أثناء استكمال الأرضيات والخدمات" src="assets/projects/tend/03-finishing.jpg" loading="lazy"/>
          <img class="tend-slide" alt="تفاصيل الدرج في Tend Salon أثناء التنفيذ" src="assets/projects/tend/04-detail.jpg" loading="lazy"/>
          <img class="tend-slide" alt="منطقة الاستقبال في Tend Salon بعد التسليم" src="assets/projects/tend/05-delivered.jpg" loading="lazy"/>
          <img class="tend-slide" alt="المساحة التشغيلية في Tend Salon بعد التسليم" src="assets/projects/tend/06-delivered.jpg" loading="lazy"/>
          <img class="tend-slide" alt="تفاصيل محطات الخدمة في Tend Salon" src="assets/projects/tend/07-delivered.jpg" loading="lazy"/>
          <img class="tend-slide" alt="واجهة Tend Salon بعد اكتمال التنفيذ" src="assets/projects/tend/08-delivered.jpg" loading="lazy"/>
          <img class="tend-slide" alt="منطقة البديكير في Tend Salon بعد التسليم" src="assets/projects/tend/09-delivered.jpg" loading="lazy"/>
          <img class="tend-slide" alt="منطقة العناية في Tend Salon بعد التسليم" src="assets/projects/tend/10-delivered.jpg" loading="lazy"/>
          <span class="project-badge">إكساء كامل من العظم</span>
          <span class="gallery-state" data-tend-state>مرحلة العظم والتأسيس</span>
          <div class="alzahi-dots" aria-label="صور مشروع Tend Salon">
          <button class="active" type="button" aria-label="الصورة 1"></button><button type="button" aria-label="الصورة 2"></button><button type="button" aria-label="الصورة 3"></button><button type="button" aria-label="الصورة 4"></button><button type="button" aria-label="الصورة 5"></button><button type="button" aria-label="الصورة 6"></button><button type="button" aria-label="الصورة 7"></button><button type="button" aria-label="الصورة 8"></button><button type="button" aria-label="الصورة 9"></button><button type="button" aria-label="الصورة 10"></button>
          </div></div>"""
          
          story="""<div class="project-story"><strong>من مساحة خام إلى تجربة تجارية متكاملة ومهيأة للتشغيل.</strong><p>مشروع إكساء كامل لمساحة 260م² لمشروع Tend Salon في العزيزية، تولّت بُنية تنفيذه من الأعمال الأساسية والتأسيسات الفنية وتنسيق أعمال MEP، مرورًا بالقواطع والأسقف والأرضيات والواجهات والعناصر الخاصة، وصولًا إلى تجهيز مناطق الخدمة والتفاصيل النهائية. قيمة المشروع كانت في ترجمة متطلبات تشغيلية دقيقة لصالون تجاري إلى بيئة متناسقة وظيفيًا وبصريًا، مع إدارة جميع المراحل ضمن مسار واحد حتى تسليم مساحة جاهزة للاستخدام وتحمل هوية المشروع بوضوح.</p></div>"""
          
          new_article=f"""<article class="project-card reveal">{gallery}<div class="project-body"><div class="project-head"><h3>Tend Salon — العزيزية</h3><span class="project-area">260 م²</span></div>{story}<div class="scope"><span>Fit-Out</span><span>MEP</span><span>واجهات</span><span>تشطيبات</span><span>أعمال خاصة</span></div><div class="project-link">من العظم إلى الجاهزية التشغيلية<i>←</i></div></div></article>"""
          s=s[:target.start()]+new_article+s[target.end():]
          
          if "const gallery=document.querySelector('[data-tend-gallery]')" not in s:
              js="""<script>
          (()=>{const gallery=document.querySelector('[data-tend-gallery]');if(!gallery)return;const slides=[...gallery.querySelectorAll('.tend-slide')],dots=[...gallery.querySelectorAll('.alzahi-dots button')],state=gallery.querySelector('[data-tend-state]');let i=0,timer=null,visible=false;const labels=['مرحلة العظم والتأسيس','مرحلة التشطيبات','مرحلة التشطيبات','تفاصيل التنفيذ','بعد التسليم','بعد التسليم','بعد التسليم','بعد التسليم','بعد التسليم','بعد التسليم'];function show(n){i=(n+slides.length)%slides.length;slides.forEach((el,k)=>el.classList.toggle('active',k===i));dots.forEach((el,k)=>el.classList.toggle('active',k===i));if(state)state.textContent=labels[i]}function stop(){if(timer){clearInterval(timer);timer=null}}function play(){stop();if(!visible||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setInterval(()=>show(i+1),3600)}dots.forEach((d,k)=>d.addEventListener('click',()=>{show(k);play()}));gallery.addEventListener('mouseenter',stop);gallery.addEventListener('mouseleave',play);gallery.addEventListener('focusin',stop);gallery.addEventListener('focusout',play);new IntersectionObserver(es=>es.forEach(e=>{visible=e.isIntersecting&&e.intersectionRatio>.25;visible?play():stop()}),{threshold:[0,.25,.6]}).observe(gallery);show(0)})();
          </script>
          """
              if "</body>" not in s:
                  raise SystemExit("Body end not found")
              s=s.replace("</body>",js+"</body>",1)
          
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/upgrade-tend-project.yml
      - name: Commit Tend upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/projects/tend .github/workflows/upgrade-tend-project.yml
          git commit -m "Upgrade Tend project story and gallery"
          git push
