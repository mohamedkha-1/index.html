name: Clean partner logos and remove duplicates
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/clean-partner-logos.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make uploaded logos transparent
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import math

          base=Path("assets/logos/partners")

          def clear_background(path, bg, inner, outer):
              im=Image.open(path).convert("RGBA")
              px=im.load()
              br,bg_,bb=bg
              for y in range(im.height):
                  for x in range(im.width):
                      r,g,b,a=px[x,y]
                      d=math.sqrt((r-br)**2+(g-bg_)**2+(b-bb)**2)
                      if d<=inner:
                          na=0
                      elif d>=outer:
                          na=a
                      else:
                          na=int(a*(d-inner)/(outer-inner))
                      px[x,y]=(r,g,b,na)
              im.save(path,"PNG",optimize=True)

          # SAON source has a solid near-black/navy field.
          clear_background(base/"saon.png",(0,0,0),8,34)
          # San Marzano and MID source images use white fields.
          clear_background(base/"sanmarzano.png",(255,255,255),8,38)
          clear_background(base/"mid.png",(255,255,255),8,38)
          PY
      - name: Remove visible partner duplicates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          # Neutral card for transparent SAON mark; no blue background.
          s=s.replace(
              '.logo-saon{background-color:#111827!important;background-image:url("assets/logos/partners/saon.png");background-size:76% auto}',
              '.logo-saon{background-color:#141414!important;background-image:url("assets/logos/partners/saon.png");background-size:76% auto}',
              1
          )
          
          # Unique partner grid styles; preserve existing card styling.
          anchor='@keyframes marq{to{transform:translateX(-50%)}}'
          grid_css='''.partner-grid{width:min(1500px,calc(100% - 48px));margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.partner-grid .logo-box{min-width:0;width:100%;height:132px}.partner-grid .logo-saon{background-color:#141414!important}@media(max-width:1100px){.partner-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.partner-grid{width:min(100% - 28px,720px);grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.partner-grid .logo-box{height:112px;border-radius:22px}}@media(max-width:430px){.partner-grid{grid-template-columns:1fr 1fr;gap:10px}.partner-grid .logo-box{height:100px;padding:16px}}'''
          if '.partner-grid{' not in s:
              if anchor not in s:
                  raise SystemExit('Marquee keyframe anchor not found')
              s=s.replace(anchor,grid_css+anchor,1)
          
          # Replace duplicated marquee sequences with one unique partner grid.
          pattern=r'<div class="marquee">.*?</div><div class="marquee rev">.*?</div></section>'
          m=re.search(pattern,s,flags=re.S)
          if not m:
              raise SystemExit('Current partner marquee block not found')
          
          unique=[
          '<div class="logo-box logo-light logo-fahras"><span>Fahras by Mid-Sajj</span></div>',
          '<div class="logo-box logo-light logo-qomra"><span>Qomra</span></div>',
          '<div class="logo-box logo-light logo-nouf"><span>Princess Nourah University</span></div>',
          '<div class="logo-box logo-light logo-elixir"><span>Elixir Bun</span></div>',
          '<div class="logo-box logo-dark logo-kalamashii"><span>Kalamashii</span></div>',
          '<div class="logo-box logo-light logo-thania"><span>Thaniah</span></div>',
          '<div class="logo-box logo-light logo-roshn"><span>ROSHN</span></div>',
          '<div class="logo-box logo-dark logo-midsajj"><span>Mid-Sajj</span></div>',
          '<div class="logo-box logo-light logo-saon"><span>SAON logistical services</span></div>',
          '<div class="logo-box logo-light logo-sanmarzano"><span>San Marzano Ristorante</span></div>',
          '<div class="logo-box logo-light logo-mid"><span>MID</span></div>'
          ]
          new='<div class="partner-grid">'+''.join(unique)+'</div></section>'
          s=s[:m.start()]+new+s[m.end():]
          
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/clean-partner-logos.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/logos/partners .github/workflows/clean-partner-logos.yml
          git commit -m "Use transparent partner logos without duplicates"
          git push
