name: Refine Alzahi project copy
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refine-alzahi-copy.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refine copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old = """<p class="project-desc" style="margin:14px 0 0;color:#786C70;font-size:12px;line-height:1.95">إعادة تأهيل متكامل لفيلا قائمة بمساحة 850م²، حوّلنا فيها مبنى قائمًا إلى مساحة جاهزة للاستخدام من خلال إدارة نطاق متعدد التخصصات ضمن جهة تنفيذ واحدة. بدأ العمل من التكسير والترحيل ومعالجة الموقع، مرورًا بالكهرباء والميكانيكا والسباكة والتكييف، وصولًا إلى الدهانات والأرضيات والأسقف والنجارة والفرش. القيمة لم تكن في تنفيذ البنود منفصلة، بل في تنسيقها وتسلسلها وإغلاق التفاصيل حتى تسليم مشروع متكامل بجودة واضحة.</p>"""
          new = """<div class="project-story"><strong>من مبنى قائم إلى مساحة متكاملة وجاهزة للاستخدام.</strong><p>إعادة تأهيل شاملة لمساحة 850م² أدارتها بُنية من مرحلة التكسير والترحيل ومعالجة الموقع، مرورًا بالأعمال الكهربائية والميكانيكية والسباكة والتكييف، وصولًا إلى التشطيبات والنجارة والفرش. نطاق متعدد التخصصات تم تنسيقه ضمن جهة تنفيذ واحدة حتى الوصول إلى نتيجة نهائية متكاملة وواضحة التفاصيل.</p></div>"""
          if old not in s:
              raise SystemExit("Current Alzahi description not found")
          s=s.replace(old,new,1)
          css_anchor = ".project-body h3{font-size:28px;margin:0}"
          css_new = ".project-body h3{font-size:28px;margin:0}.project-story{margin:15px 0 0}.project-story strong{display:block;color:#35101F;font-size:14px;line-height:1.8;margin-bottom:6px}.project-story p{margin:0;color:#786C70;font-size:12px;line-height:1.95}"
          if ".project-story{" not in s:
              if css_anchor not in s: raise SystemExit("Project body CSS anchor not found")
              s=s.replace(css_anchor,css_new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/refine-alzahi-copy.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/refine-alzahi-copy.yml
          git commit -m "Refine Alzahi project copy"
          git push
