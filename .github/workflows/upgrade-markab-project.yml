name: Upgrade Markab project card
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-markab-project.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Markab project images
        run: |
          mkdir -p assets/projects/markab
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/a9f5635b-0eeb-4967-88b7-48af719bcffa.jpg" -o assets/projects/markab/01-foundation.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/bebfd2c4-ae2d-4fe2-a43a-e9dfd31c5afb.jpg" -o assets/projects/markab/02-foundation.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/1a875d9c-6296-433e-a97f-13d70b0888f4.jpg" -o assets/projects/markab/03-finishing.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/1aa4f31f-dfde-4975-85ee-db4c73225fa7.jpg" -o assets/projects/markab/04-finishing.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/4b237292-b326-4826-b483-9cab7c50a7d9.png" -o /tmp/markab-05.png
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/8423da07-ea0d-42ab-8092-6afa09fd2353.png" -o /tmp/markab-06.png
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/989e140d-6145-4189-ad36-017b0ea799dd.png" -o /tmp/markab-07.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          for n in (5,6,7):
              src=f"/tmp/markab-{n:02d}.png"
              dst=f"assets/projects/markab/{n:02d}-delivered.jpg"
              im=Image.open(src).convert("RGB")
              im.save(dst,"JPEG",quality=84,optimize=True,progressive=True)
          PY
          for f in assets/projects/markab/*; do test -s "$f"; done
      - name: Upgrade Markab card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          css_anchor=".alzahi-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          css_add=css_anchor+".markab-gallery{position:relative}.markab-gallery .markab-slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1.015);transition:opacity .75s ease,transform 1.2s var(--ease);object-fit:cover}.markab-gallery .markab-slide.active{opacity:1;transform:scale(1);z-index:1}.project-card:hover .markab-gallery .markab-slide.active{transform:scale(1.035)}.markab-gallery .project-badge{z-index:5}.markab-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          if ".markab-gallery{" not in s:
              if css_anchor not in s:
                  raise SystemExit("Gallery CSS anchor not found")
              s=s.replace(css_anchor,css_add,1)
          
          articles=list(re.finditer(r'<article class="project-card reveal">.*?</article>',s,flags=re.S))
          target=next((m for m in articles if '<h3>مركب</h3>' in m.group(0)),None)
          if not target:
              raise SystemExit("Markab card not found")
          
          gallery="""<div class="project-image markab-gallery" data-markab-gallery>
          <img class="markab-slide active" alt="مركب في مرحلة تأسيس الأعمال الداخلية" src="assets/projects/markab/01-foundation.jpg" loading="lazy"/>
          <img class="markab-slide" alt="مركب أثناء تأسيس الأعمال الفنية" src="assets/projects/markab/02-foundation.jpg" loading="lazy"/>
          <img class="markab-slide" alt="مركب أثناء مرحلة التشطيبات والتجهيز" src="assets/projects/markab/03-finishing.jpg" loading="lazy"/>
          <img class="markab-slide" alt="مركب أثناء استكمال التشطيبات الداخلية" src="assets/projects/markab/04-finishing.jpg" loading="lazy"/>
          <img class="markab-slide" alt="واجهة مركب بعد اكتمال التنفيذ" src="assets/projects/markab/05-delivered.jpg" loading="lazy"/>
          <img class="markab-slide" alt="المساحة الخارجية لمركب بعد التسليم" src="assets/projects/markab/06-delivered.jpg" loading="lazy"/>
          <img class="markab-slide" alt="تفاصيل الجلسات في مركب بعد التسليم" src="assets/projects/markab/07-delivered.jpg" loading="lazy"/>
          <span class="project-badge">إكساء كامل من العظم</span>
          <span class="gallery-state" data-markab-state>مرحلة التأسيس</span>
          <div class="alzahi-dots" aria-label="صور مشروع مركب">
          <button class="active" type="button" aria-label="الصورة 1"></button><button type="button" aria-label="الصورة 2"></button><button type="button" aria-label="الصورة 3"></button><button type="button" aria-label="الصورة 4"></button><button type="button" aria-label="الصورة 5"></button><button type="button" aria-label="الصورة 6"></button><button type="button" aria-label="الصورة 7"></button>
          </div></div>"""
          
          story="""<div class="project-story"><strong>من العظم إلى مساحة تجارية متكاملة تعكس هوية مركب.</strong><p>مشروع إكساء كامل لمساحة 600م² تولّت بُنية تنفيذه عبر مسار مترابط بدأ بالأعمال الإنشائية والتأسيسات الفنية وتنسيق أعمال MEP، ثم التشطيبات والعناصر الخاصة والواجهات، وصولًا إلى تجهيز المساحة للجاهزية التشغيلية. التحدي لم يكن في تعدد البنود فقط، بل في ضبط علاقتها ببعضها وتحويل التصميم إلى واقع متناسق وظيفيًا وبصريًا؛ لذلك أُديرت مراحل التنفيذ كمنظومة واحدة حتى تسليم مساحة مكتملة وواضحة التفاصيل.</p></div>"""
          
          new_article=f"""<article class="project-card reveal">{gallery}<div class="project-body"><div class="project-head"><h3>مركب</h3><span class="project-area">600 م²</span></div>{story}<div class="scope"><span>Fit-Out</span><span>MEP</span><span>تشطيبات</span><span>أعمال خاصة</span><span>واجهات</span></div><div class="project-link">من العظم إلى الجاهزية التشغيلية<i>←</i></div></div></article>"""
          
          s=s[:target.start()]+new_article+s[target.end():]
          
          if "const gallery=document.querySelector('[data-markab-gallery]')" not in s:
              js="""<script>
          (()=>{const gallery=document.querySelector('[data-markab-gallery]');if(!gallery)return;const slides=[...gallery.querySelectorAll('.markab-slide')],dots=[...gallery.querySelectorAll('.alzahi-dots button')],state=gallery.querySelector('[data-markab-state]');let i=0,timer=null,visible=false;const labels=['مرحلة التأسيس','مرحلة التأسيس','مرحلة التشطيبات','مرحلة التشطيبات','بعد التسليم','بعد التسليم','بعد التسليم'];function show(n){i=(n+slides.length)%slides.length;slides.forEach((el,k)=>el.classList.toggle('active',k===i));dots.forEach((el,k)=>el.classList.toggle('active',k===i));if(state)state.textContent=labels[i]}function stop(){if(timer){clearInterval(timer);timer=null}}function play(){stop();if(!visible||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setInterval(()=>show(i+1),3600)}dots.forEach((d,k)=>d.addEventListener('click',()=>{show(k);play()}));gallery.addEventListener('mouseenter',stop);gallery.addEventListener('mouseleave',play);gallery.addEventListener('focusin',stop);gallery.addEventListener('focusout',play);new IntersectionObserver(es=>es.forEach(e=>{visible=e.isIntersecting&&e.intersectionRatio>.25;visible?play():stop()}),{threshold:[0,.25,.6]}).observe(gallery);show(0)})();
          </script>
          """
              if "</body>" not in s:
                  raise SystemExit("Body end not found")
              s=s.replace("</body>",js+"</body>",1)
          
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/upgrade-markab-project.yml
      - name: Commit Markab upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/projects/markab .github/workflows/upgrade-markab-project.yml
          git commit -m "Upgrade Markab project story and gallery"
          git push
