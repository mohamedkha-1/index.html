name: Upgrade San Marzano project card
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-sanmarzano-project.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download San Marzano images
        run: |
          mkdir -p assets/projects/sanmarzano
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/4875d47d-6bf7-4d80-8896-489a8ff10f90.jpg" -o assets/projects/sanmarzano/01-main.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/2fb9c2f0-976c-4a61-824d-5208de20afb8.jpg" -o assets/projects/sanmarzano/02-bar.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/c8256298-7d77-4a71-87e3-4f6f01e59968.jpg" -o assets/projects/sanmarzano/03-kitchen.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/b8da21a7-50e0-4a36-b373-e36e950cb569.jpg" -o assets/projects/sanmarzano/04-table.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/b0ac5e88-5c25-46ab-ae3a-bfb2e1f19505.jpg" -o assets/projects/sanmarzano/05-seating.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/d727f585-0f17-40a8-bff7-81590fb24a31.jpg" -o assets/projects/sanmarzano/06-interior.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/09ae344b-c503-417d-a89e-b2427e8c31d2.jpg" -o assets/projects/sanmarzano/07-facade.jpg
          for f in assets/projects/sanmarzano/*; do test -s "$f"; done
      - name: Upgrade San Marzano card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          css_anchor=".tend-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          css_add=css_anchor+".sanmarzano-gallery{position:relative}.sanmarzano-gallery .sanmarzano-slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(1.015);transition:opacity .75s ease,transform 1.2s var(--ease);object-fit:cover}.sanmarzano-gallery .sanmarzano-slide.active{opacity:1;transform:scale(1);z-index:1}.project-card:hover .sanmarzano-gallery .sanmarzano-slide.active{transform:scale(1.035)}.sanmarzano-gallery .project-badge{z-index:5}.sanmarzano-gallery .gallery-state{position:absolute;left:18px;top:18px;z-index:5;background:rgba(255,255,255,.88);color:#35101F;border:1px solid rgba(53,16,31,.08);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(10px)}"
          if ".sanmarzano-gallery{" not in s:
              if css_anchor not in s:
                  raise SystemExit("Gallery CSS anchor not found")
              s=s.replace(css_anchor,css_add,1)
          
          articles=list(re.finditer(r'<article class="project-card reveal">.*?</article>',s,flags=re.S))
          target=next((m for m in articles if 'San Marzano — ليسن فالي' in m.group(0)),None)
          if not target:
              raise SystemExit("San Marzano card not found")
          
          gallery="""<div class="project-image sanmarzano-gallery" data-sanmarzano-gallery>
          <img class="sanmarzano-slide active" alt="المساحة الرئيسية لمطعم San Marzano بعد التسليم" src="assets/projects/sanmarzano/01-main.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="تفاصيل البار والتشطيبات في San Marzano" src="assets/projects/sanmarzano/02-bar.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="المطبخ وتجهيزات التشغيل في San Marzano" src="assets/projects/sanmarzano/03-kitchen.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="تفاصيل تجربة الطاولة في San Marzano" src="assets/projects/sanmarzano/04-table.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="تفاصيل الجلسات والنجارة في San Marzano" src="assets/projects/sanmarzano/05-seating.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="منطقة البار والجلوس في San Marzano" src="assets/projects/sanmarzano/06-interior.jpg" loading="lazy"/>
          <img class="sanmarzano-slide" alt="واجهة مطعم San Marzano في ليسن فالي" src="assets/projects/sanmarzano/07-facade.jpg" loading="lazy"/>
          <span class="project-badge">إكساء وتجهيز كامل</span>
          <span class="gallery-state" data-sanmarzano-state>بعد التسليم</span>
          <div class="alzahi-dots" aria-label="صور مشروع San Marzano">
          <button class="active" type="button" aria-label="الصورة 1"></button><button type="button" aria-label="الصورة 2"></button><button type="button" aria-label="الصورة 3"></button><button type="button" aria-label="الصورة 4"></button><button type="button" aria-label="الصورة 5"></button><button type="button" aria-label="الصورة 6"></button><button type="button" aria-label="الصورة 7"></button>
          </div></div>"""
          
          story="""<div class="project-story"><strong>تنفيذ مساحة ضيافة صغيرة بحس تفصيلي عالٍ وتجربة مكتملة من الواجهة حتى التشغيل.</strong><p>مشروع إكساء وتجهيز لمساحة 120م² في San Marzano — ليسن فالي، جمع بين الأعمال الفنية والتشطيبات والنجارة والإضاءة والواجهة وتجهيزات التشغيل ضمن مساحة محدودة تتطلب دقة عالية في توزيع الوظائف والحركة. ركز التنفيذ على ربط التفاصيل البصرية بالاحتياج التشغيلي للمطعم، من منطقة الخدمة والبار إلى الجلسات والواجهة، حتى خرجت المساحة كبيئة ضيافة متماسكة وجاهزة للتشغيل بهوية واضحة وتجربة متوازنة للعميل.</p></div>"""
          
          new_article=f"""<article class="project-card reveal">{gallery}<div class="project-body"><div class="project-head"><h3>San Marzano — ليسن فالي</h3><span class="project-area">120 م²</span></div>{story}<div class="scope"><span>Fit-Out</span><span>MEP</span><span>تشطيبات</span><span>نجارة</span><span>واجهة</span><span>تجهيز تشغيل</span></div><div class="project-link">من التفاصيل إلى تجربة ضيافة جاهزة<i>←</i></div></div></article>"""
          s=s[:target.start()]+new_article+s[target.end():]
          
          if "const gallery=document.querySelector('[data-sanmarzano-gallery]')" not in s:
              js="""<script>
          (()=>{const gallery=document.querySelector('[data-sanmarzano-gallery]');if(!gallery)return;const slides=[...gallery.querySelectorAll('.sanmarzano-slide')],dots=[...gallery.querySelectorAll('.alzahi-dots button')],state=gallery.querySelector('[data-sanmarzano-state]');let i=0,timer=null,visible=false;const labels=['المساحة الرئيسية','تفاصيل التشطيبات','التجهيز التشغيلي','تفاصيل الضيافة','تفاصيل الجلسات','منطقة البار','الواجهة'];function show(n){i=(n+slides.length)%slides.length;slides.forEach((el,k)=>el.classList.toggle('active',k===i));dots.forEach((el,k)=>el.classList.toggle('active',k===i));if(state)state.textContent=labels[i]}function stop(){if(timer){clearInterval(timer);timer=null}}function play(){stop();if(!visible||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;timer=setInterval(()=>show(i+1),3600)}dots.forEach((d,k)=>d.addEventListener('click',()=>{show(k);play()}));gallery.addEventListener('mouseenter',stop);gallery.addEventListener('mouseleave',play);gallery.addEventListener('focusin',stop);gallery.addEventListener('focusout',play);new IntersectionObserver(es=>es.forEach(e=>{visible=e.isIntersecting&&e.intersectionRatio>.25;visible?play():stop()}),{threshold:[0,.25,.6]}).observe(gallery);show(0)})();
          </script>
          """
              if "</body>" not in s:
                  raise SystemExit("Body end not found")
              s=s.replace("</body>",js+"</body>",1)
          
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/upgrade-sanmarzano-project.yml
      - name: Commit San Marzano upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/projects/sanmarzano .github/workflows/upgrade-sanmarzano-project.yml
          git commit -m "Upgrade San Marzano project story and gallery"
          git push
