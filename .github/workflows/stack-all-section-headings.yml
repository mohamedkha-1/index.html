name: Stack all section headings

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stack-all-section-headings.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Stack section titles globally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old = ".section-title{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-bottom:48px}"
          new = ".section-title{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:18px;margin-bottom:48px}"

          if old not in s:
              raise SystemExit("Global section-title rule not found")
          s = s.replace(old, new, 1)

          old_p = ".section-title p{max-width:650px;color:var(--muted);font-size:17px;line-height:1.9;margin:0}"
          new_p = ".section-title p{max-width:820px;width:100%;color:var(--muted);font-size:17px;line-height:1.9;margin:0}"

          if old_p not in s:
              raise SystemExit("Section description rule not found")
          s = s.replace(old_p, new_p, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/stack-all-section-headings.yml

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/stack-all-section-headings.yml
          git commit -m "Stack all section heading content"
          git push
