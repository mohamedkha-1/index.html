name: Update Dhafa visual journey
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-dhafa-journey.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Dhafa images
        run: |
          mkdir -p assets/projects/dhafa
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/78bcc84e-aeb2-425e-a4e7-6bbc1f385101.jpg" -o assets/projects/dhafa/01-design.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/8241d15b-7179-4439-87ed-99f20691545f.jpg" -o assets/projects/dhafa/02-site.jpg
          curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3HBPmZt3l78Cs2wbn6HfhyTxhWQ/27289db9-b4c7-4c76-ac1c-31d77b3c954d.jpg" -o assets/projects/dhafa/03-result.jpg
          for f in assets/projects/dhafa/*; do test -s "$f"; done
      - name: Update visual journey section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          
          pattern=r'<section class="section visual-journey" id="visual-journey">.*?</section>'
          m=re.search(pattern,s,flags=re.S)
          if not m:
              raise SystemExit("visual journey section not found")
          
          section="""<section class="section visual-journey" id="visual-journey">
            <div class="wrap">
              <div class="section-title reveal">
                <div>
                  <span class="ey light">CASE STUDY — DESIGN → SITE → RESULT</span>
                  <h2>ضفة | من التصور إلى النتيجة.</h2>
                </div>
                <p>كيف تحوّل التصور المعتمد للواجهة والهوية إلى تنفيذ فعلي في الموقع، من اعتماد التصميم وتجهيز المدخل، مرورًا بأعمال التنفيذ، وصولًا إلى الواجهة النهائية.</p>
              </div>
              <div class="visual-sequence reveal" aria-label="مشروع ضفة من التصميم إلى النتيجة">
                <article class="visual-panel design">
                  <img src="assets/projects/dhafa/01-design.jpg" alt="التصميم المعتمد لواجهة ضفة قبل التنفيذ" loading="lazy"/>
                  <div class="visual-label">
                    <div><strong>التصميم</strong><small>التصور المعتمد للواجهة والهوية قبل التنفيذ</small></div>
                    <span class="visual-step">DESIGN</span>
                  </div>
                </article>
                <article class="visual-panel before">
                  <img src="assets/projects/dhafa/02-site.jpg" alt="واجهة ضفة أثناء أعمال التنفيذ وتجهيز المدخل" loading="lazy"/>
                  <div class="visual-label">
                    <div><strong>أثناء التنفيذ</strong><small>تجهيز المدخل وتنفيذ عناصر الواجهة بالموقع</small></div>
                    <span class="visual-step">SITE</span>
                  </div>
                </article>
                <article class="visual-panel after">
                  <img src="assets/projects/dhafa/03-result.jpg" alt="واجهة ضفة بعد اكتمال التنفيذ" loading="lazy"/>
                  <div class="visual-label">
                    <div><strong>النتيجة</strong><small>الواجهة بعد اكتمال التنفيذ وتثبيت الهوية</small></div>
                    <span class="visual-step">RESULT</span>
                  </div>
                </article>
              </div>
            </div>
          </section>"""
          
          s=s[:m.start()]+section+s[m.end():]
          
          css_anchor=".visual-label strong"
          if css_anchor in s and ".visual-label small{max-width:" not in s:
              s=s.replace(css_anchor, ".visual-label small{max-width:190px;display:block;line-height:1.55}.visual-label strong",1)
          
          p.write_text(s,encoding="utf-8")
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/update-dhafa-journey.yml
      - name: Commit Dhafa journey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/projects/dhafa .github/workflows/update-dhafa-journey.yml
          git commit -m "Update Dhafa visual journey"
          git push
