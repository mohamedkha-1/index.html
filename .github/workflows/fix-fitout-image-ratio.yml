name: Fix Fit-Out article image ratio
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-fitout-image-ratio.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix image sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          # Add a dedicated class to the first Fit-Out article image wrapper.
          pattern=r'(<article class="article big reveal"><div class="article-img)(?="><img alt="تنفيذ Fit-Out")'
          s,n=re.subn(pattern,r'\1 fitout-full-image',s,count=1)
          if n == 0 and 'fitout-full-image' not in s:
              raise SystemExit("Could not locate Fit-Out article image wrapper")
          css=r'''
          <style id="fitout-full-image-fix">
          .article.big .article-img.fitout-full-image{
            height:auto!important;
            min-height:0!important;
            aspect-ratio:auto!important;
            overflow:hidden!important;
            background:#f3eee8!important;
          }
          .article.big .article-img.fitout-full-image img{
            display:block!important;
            width:100%!important;
            height:auto!important;
            min-height:0!important;
            max-height:none!important;
            aspect-ratio:auto!important;
            object-fit:contain!important;
            object-position:center center!important;
          }
          @media(max-width:700px){
            .article.big .article-img.fitout-full-image,
            .article.big .article-img.fitout-full-image img{
              height:auto!important;
              min-height:0!important;
              max-height:none!important;
              object-fit:contain!important;
            }
          }
          </style>
          '''
          if 'id="fitout-full-image-fix"' in s:
              s=re.sub(r'<style id="fitout-full-image-fix">.*?</style>',css.strip(),s,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-fitout-image-ratio.yml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-fitout-image-ratio.yml
          git commit -m "Show full Fit-Out article image without cropping"
          git push
